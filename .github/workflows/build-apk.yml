
name: Build PhoneAtlas APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract PhoneAtlas ZIP
        run: |
          unzip -o PhoneAtlas-Android-Source.zip -d .
          cd PhoneAtlas
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAtlas-debug-apk
          path: PhoneAtlas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
